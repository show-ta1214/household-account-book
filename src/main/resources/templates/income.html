<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>収入入力 | 家計簿</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="entry-page income-page">
<main class="income-card">
    <h1>収入入力</h1>
    <p class="description">収入の内容を入力してください。</p>
    <p class="success-message" th:if="${successMessage}" th:text="${successMessage}"></p>

    <form th:action="@{/income}" th:object="${incomeForm}" method="post">
        <div class="form-group">
            <label for="income-date">収入日</label>
            <input id="income-date" th:field="*{incomeDate}" type="date" required
                   th:classappend="${#fields.hasErrors('incomeDate')} ? 'has-error'">
            <p class="error-message" th:if="${#fields.hasErrors('incomeDate')}"
               th:errors="*{incomeDate}"></p>
        </div>

        <div class="form-group">
            <label for="category">カテゴリー</label>
            <select id="category" th:field="*{category}" required
                    th:classappend="${#fields.hasErrors('category')} ? 'has-error'">
                <option value="">選択してください</option>
                <option value="salary">給与</option>
                <option value="bonus">賞与</option>
                <option value="side-job">副業</option>
                <option value="investment">投資</option>
                <option value="other">その他</option>
            </select>
            <p class="error-message" th:if="${#fields.hasErrors('category')}"
               th:errors="*{category}"></p>
        </div>

        <div class="form-group">
            <label for="amount">金額（円）</label>
            <input id="amount" th:field="*{amount}" type="number" min="1" max="999999999" step="1"
                   placeholder="例：250000" required th:classappend="${#fields.hasErrors('amount')} ? 'has-error'">
            <p class="error-message" th:if="${#fields.hasErrors('amount')}"
               th:errors="*{amount}"></p>
        </div>

        <div class="form-group">
            <label for="memo">メモ</label>
            <textarea id="memo" th:field="*{memo}" maxlength="200" placeholder="例：8月分給与"
                      th:classappend="${#fields.hasErrors('memo')} ? 'has-error'"></textarea>
            <p class="error-message" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></p>
        </div>

        <div class="actions">
            <a class="button back-button" th:href="@{/}" href="/">ホームへ戻る</a>
            <button class="button primary-button" type="submit">入力内容を確認</button>
        </div>
    </form>
</main>
</body>
</html>
