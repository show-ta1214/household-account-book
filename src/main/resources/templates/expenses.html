<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支出入力 | 家計簿</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="entry-page expense-page">
<main class="expense-card">
    <h1 th:text="${editMode} ? '支出を編集' : '支出入力'">支出入力</h1>
    <p class="description" th:text="${editMode} ? '支出の内容を変更してください。' : '支出の内容を入力してください。'">支出の内容を入力してください。</p>
    <p class="success-message" th:if="${successMessage}" th:text="${successMessage}"></p>

    <form th:action="${editMode} ? @{/records/expenses/{id}/edit(id=${recordId})} : @{/expenses}" th:object="${expenseForm}" method="post">
        <div class="form-group">
            <label for="expense-date">支出日</label>
            <input id="expense-date" th:field="*{expenseDate}" type="date" required
                   th:classappend="${#fields.hasErrors('expenseDate')} ? 'has-error'">
            <p class="error-message" th:if="${#fields.hasErrors('expenseDate')}"
               th:errors="*{expenseDate}"></p>
        </div>

        <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" th:field="*{category}" required
                    th:classappend="${#fields.hasErrors('category')} ? 'has-error'">
                <option value="">選択してください</option>
                <option value="food">食費</option>
                <option value="daily">日用品</option>
                <option value="transportation">交通費</option>
                <option value="utilities">水道・光熱費</option>
                <option value="entertainment">娯楽費</option>
                <option value="other">その他</option>
            </select>
            <p class="error-message" th:if="${#fields.hasErrors('category')}"
               th:errors="*{category}"></p>
        </div>

        <div class="form-group">
            <label for="amount">金額（円）</label>
            <input id="amount" th:field="*{amount}" type="number" min="1" max="999999999" step="1"
                   placeholder="例：1200" required onkeydown="if(['e', 'E', '+', '-'].includes(event.key)) event.preventDefault()"th:classappend="${#fields.hasErrors('amount')} ? 'has-error'">
            <p class="error-message" th:if="${#fields.hasErrors('amount')}"
               th:errors="*{amount}"></p>
        </div>

        <div class="form-group">
            <label for="memo">メモ</label>
            <textarea id="memo" th:field="*{memo}" maxlength="200" placeholder="例：スーパーで食材を購入"
                      th:classappend="${#fields.hasErrors('memo')} ? 'has-error'"></textarea>
            <p class="error-message" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></p>
        </div>

        <div class="actions">
            <a class="button back-button" th:href="${editMode} ? @{/records} : @{/}" href="/">戻る</a>
            <button class="button primary-button" type="submit" th:text="${editMode} ? '更新する' : '入力内容を確認'">入力内容を確認</button>
        </div>
    </form>
</main>
</body>
</html>
